<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Puzzle Arcade</title>
<meta name="theme-color" content="#E8EBF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11132A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app. Home = three arcade "cabinets" with rating readouts; play = full-height board screen tinted by that game's accent */
:root{
  --bg:#E8EBF4; --surface:#FFFFFF; --ink:#191C38; --muted:#5C6287; --line:#CDD2E6; --soft:#DFE3F2;
  --sdk:#4A4ED6; --num:#D9492F; --wrd:#16806F; --mm:#A23FB8;
  --ok:#2E9A58; --warn:#D2960E; --bad:#D23838; --absent:#8B90AE; --tip:#F4B400;
  --farm:#3B8A3E; --soil:#C8A27C; --soilWet:#9A7350;
  --key:#DFE3F2; --keyInk:#191C38; --keyUsed:#8B90AE; --keyUsedInk:#FFFFFF;
  --f-display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --acc:var(--sdk);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11132A; --surface:#1B1E3C; --ink:#ECEEFF; --muted:#9CA2CC; --line:#30355F; --soft:#262A4D;
  --sdk:#8C90FF; --num:#FF7A5F; --wrd:#3CC7AE; --mm:#D98CF2;
  --ok:#3FB96E; --warn:#E5AE2A; --bad:#FF5C5C; --absent:#2D3055; --tip:#FFD24A;
  --farm:#6CC66A; --soil:#5B4633; --soilWet:#41301F;
  --key:#5B6091; --keyInk:#F2F3FF; --keyUsed:#1E2142; --keyUsedInk:#5E6390; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11132A; --surface:#1B1E3C; --ink:#ECEEFF; --muted:#9CA2CC; --line:#30355F; --soft:#262A4D;
  --sdk:#8C90FF; --num:#FF7A5F; --wrd:#3CC7AE; --mm:#D98CF2;
  --ok:#3FB96E; --warn:#E5AE2A; --bad:#FF5C5C; --absent:#2D3055; --tip:#FFD24A;
  --farm:#6CC66A; --soil:#5B4633; --soilWet:#41301F;
  --key:#5B6091; --keyInk:#F2F3FF; --keyUsed:#1E2142; --keyUsedInk:#5E6390; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding-block:18px 28px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}

/* Home */
.brand{display:flex;flex-direction:column;gap:4px}
.brandrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:2.3rem;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand h1 span{color:var(--sdk)} .brand h1 span+span{color:var(--num)} .brand h1 span+span+span{color:var(--wrd)}
.brand p{margin:0;color:var(--muted)}
.acctB{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.85rem;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.acctB i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.acctB i.on{background:var(--ok)} .acctB i.wait{background:var(--warn)}
.cabs{display:flex;flex-direction:column;gap:12px}
.cab{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden;transition:transform .12s}
.cab:active{transform:scale(.98)}
.cab::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.cab .glyph{width:64px;height:64px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.cab h2{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:0;line-height:1.1}
.cab .meta{color:var(--muted);font-size:.85rem;margin-top:2px}
.cab .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rnum{font-family:var(--f-mono);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.chip{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--ink)}
.chip.live{background:var(--c);color:var(--surface)}
.spark{display:block;margin-top:6px}
.g-sdk{display:grid;grid-template-columns:repeat(3,14px);gap:2px}
.g-sdk i{height:14px;background:var(--surface);border-radius:2px;font:700 10px/14px var(--f-mono);text-align:center;font-style:normal;color:var(--sdk)}
.g-num{display:flex;gap:4px;font:700 20px var(--f-mono);color:var(--num)}
.g-num b{width:22px;height:26px;border-radius:6px;display:grid;place-items:center;border:2px solid var(--num)}
.g-wrd{display:grid;grid-template-columns:repeat(3,15px);gap:3px}
.g-wrd i{height:15px;border-radius:3px}
.howto{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.howto b{color:var(--ink)}
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ladder span{font-size:.72rem;font-family:var(--f-mono);padding:2px 7px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}

/* Play */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.back{font-weight:800;padding:8px 10px 8px 2px;color:var(--muted);justify-self:start}
.help{justify-self:end;width:34px;height:34px;border-radius:50%;border:2px solid var(--acc);color:var(--acc);font:400 1rem var(--f-display);display:grid;place-items:center;padding:0}
/* Rules sheet */
.rules{gap:10px}
.rl{display:grid;grid-template-columns:136px 1fr;gap:14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rv{display:flex;align-items:center;gap:8px;min-width:0}
.rt{color:var(--ink);font-size:.92rem;line-height:1.35}
.rt b{color:var(--acc)}
.dstrip{display:flex;gap:3px;align-items:center}
.dt{width:24px;height:24px;border-radius:5px;background:var(--soft);display:grid;place-items:center;font:700 .85rem var(--f-mono);color:var(--ink)}
.dt.sel{background:var(--acc);color:var(--surface)} .dt.ring{background:transparent;box-shadow:inset 0 0 0 2px var(--acc)}
.dt.gone{background:transparent;box-shadow:inset 0 0 0 1px var(--line)} .dt.bad{color:var(--bad)} .dt.key{color:var(--sdk);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.d3x3{display:grid;grid-template-columns:repeat(3,22px);gap:3px}.d3x3 .dt{width:22px;height:22px}
.dwrap{display:flex;flex-direction:column;gap:3px}.dots{color:var(--muted);font-weight:800;width:14px;text-align:center}
.ar{color:var(--muted);font-weight:800;padding:0 2px}
.rk{font-weight:800;font-size:1.1rem}.rk.ok{color:var(--ok)}.rk.no{color:var(--bad)}
.mini9{display:grid;grid-template-columns:repeat(9,9px);gap:1px;background:var(--line);border:2px solid var(--ink);width:max-content}
.mini9 i{width:9px;height:9px;background:var(--surface)}.mini9 i.hr,.mini9 i.hc{background:var(--sdk)}.mini9 i.hb{background:color-mix(in srgb,var(--sdk) 45%,var(--surface))}
.dnotes{display:grid;grid-template-columns:repeat(3,11px);width:40px;height:40px;place-items:center;border:1px solid var(--line);border-radius:4px;font:500 .62rem var(--f-mono);color:var(--muted);background:var(--surface)}
.dclock{font:700 1rem var(--f-mono);color:var(--acc);padding:4px 10px;border:2px solid var(--acc);border-radius:99px}
.dbtn{padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:.8rem;background:var(--surface)}
.dword{display:grid;grid-template-columns:repeat(5,34px);gap:5px;margin-bottom:4px}
.rules .wt{width:34px;font-size:1rem;aspect-ratio:1;box-sizing:border-box}
.dpeg{width:18px;height:18px;font-size:.55rem;flex:none}.dpeg.hid{background:var(--ink);color:var(--surface)}
.pin.big{width:16px;height:16px}
.dtip{pointer-events:none;padding:5px 12px;font-size:.8rem}
.top h2{font-family:var(--f-display);font-weight:400;font-size:1.2rem;margin:0;text-align:center;color:var(--acc)}
.vs{display:flex;gap:8px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.vs div{display:flex;flex-direction:column}
.vs small{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.vs strong{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.vs .mid{align-items:center;justify-content:center}
.vs .right{align-items:flex-end}
.info{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums;min-height:1.3em}
.info b{color:var(--ink)}
.stage{display:flex;flex-direction:column;gap:14px;flex:1}
.loading{display:grid;place-items:center;min-height:260px;color:var(--muted);font-weight:600}
.giveup{align-self:center;color:var(--muted);font-size:.85rem;padding:8px 14px;border-radius:99px;border:1px solid var(--line)}
.giveup.arm{color:var(--bad);border-color:var(--bad)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.9rem}
.tool.on{background:var(--acc);color:var(--surface);border-color:var(--acc)}
.tool.tipB{border-color:var(--tip)}
.tool.tipB::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tip)}
.tool[disabled]{opacity:.4}

/* Sudoku */
.sgrid{display:grid;grid-template-columns:repeat(9,1fr);width:100%;max-width:440px;aspect-ratio:1;margin:0 auto;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sc{position:relative;display:grid;place-items:center;font:600 clamp(18px,5.6vw,26px) var(--f-body);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;min-width:0}
.sc:nth-child(9n){border-right:0}
.sc:nth-child(9n+3),.sc:nth-child(9n+6){border-right:2.5px solid var(--ink)}
.sc:nth-child(n+19):nth-child(-n+27),.sc:nth-child(n+46):nth-child(-n+54){border-bottom:2.5px solid var(--ink)}
.sc:nth-child(n+73){border-bottom:0}
.sc.given{font-weight:800}
.sc.user{color:var(--sdk)}
.sc.peer{background:var(--soft)}
.sc.same{background:color-mix(in srgb,var(--sdk) 22%,var(--surface))}
.sc.sel{background:color-mix(in srgb,var(--sdk) 38%,var(--surface))}
.sc.wrong{color:var(--bad)}
.sc.area{background:color-mix(in srgb,var(--tip) 22%,var(--surface))}
.sc.hint{box-shadow:inset 0 0 0 3px var(--tip);z-index:1}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font:500 clamp(8px,2.2vw,11px)/1 var(--f-mono);color:var(--muted)}
.notes span{display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;max-width:440px;width:100%;margin:0 auto}
.pad button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;font:700 1.35rem var(--f-body);color:var(--sdk)}
.pad button small{font:500 .62rem var(--f-mono);color:var(--muted)}
.pad button[disabled]{opacity:.25}

/* Number match */
.nwrap{max-height:62vh;overflow-y:auto;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)) + 3px);margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)) + 3px)}
.ngrid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.nc{aspect-ratio:1;border-radius:6px;font:700 clamp(20px,6.4vw,30px) var(--f-mono);display:grid;place-items:center;color:var(--ink);background:var(--soft);padding:0;min-width:0;transition:background .15s,transform .1s}
.nc.x{background:transparent;color:var(--line);pointer-events:none}
.nc.blank{background:transparent;pointer-events:none}
.nc.sel{background:var(--num);color:var(--surface);transform:scale(1.06)}
.nc.hint{box-shadow:inset 0 0 0 3px var(--tip);background:color-mix(in srgb,var(--tip) 25%,var(--soft))}
.nc.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.rule{font-size:.8rem;color:var(--muted);text-align:center;margin:0}

/* Wordle */
.wboard{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:100%;max-width:300px;margin:0 auto}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wrow.bad{animation:shake .3s}
.wt{aspect-ratio:1;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font:400 clamp(22px,7vw,30px) var(--f-display);text-transform:uppercase;background:var(--surface)}
.wt.filled{border-color:var(--muted)}
.wt.c,.wt.p,.wt.a{color:#fff;border-color:transparent;animation:flip .45s both}
.wt.c{background:var(--ok)} .wt.p{background:var(--warn)} .wt.a{background:var(--absent)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:440px;margin:0 auto}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:42px;height:52px;border-radius:7px;background:var(--key);color:var(--keyInk);font-weight:800;font-size:1rem;text-transform:uppercase;padding:0}
.k.wide{max-width:66px;flex:1.5;font-size:.72rem}
.k.c{background:var(--ok);color:#fff} .k.p{background:var(--warn);color:#fff} .k.a{background:var(--keyUsed);color:var(--keyUsedInk)}
.badge{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--wrd)}

/* Mastermind */
.mmboard{display:flex;flex-direction:column;gap:5px;width:100%;max-width:400px;margin:0 auto}
.mmrow{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:4px 8px;border-radius:12px}
.mmrow.act{background:var(--surface);box-shadow:inset 0 0 0 2px var(--mm)}
.mmn{font:600 .75rem var(--f-mono);color:var(--muted);text-align:right}
.mmpegs{display:grid;grid-template-columns:repeat(var(--L),1fr);gap:8px}
.peg{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 .72rem var(--f-mono);color:rgba(255,255,255,.85);padding:0;min-width:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.slot{max-width:34px;width:100%;justify-self:center}
.slot.empty{background:var(--soft);box-shadow:inset 0 2px 3px color-mix(in srgb,var(--ink) 15%,transparent)}
.slot.sel{outline:3px solid var(--mm);outline-offset:2px}
.pins{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
.pin{width:9px;height:9px;border-radius:50%;background:var(--soft);display:inline-block;vertical-align:middle;box-sizing:border-box}
.pin.ex{background:var(--ink)}
.pin.cl{background:transparent;border:2px solid var(--ink)}
.mmpal{display:grid;grid-template-columns:repeat(var(--C),1fr);gap:8px;width:100%;max-width:440px;margin:0 auto}
.mmpal .peg{font-size:.85rem;max-width:48px;width:100%;justify-self:center}
.mmchips{display:inline-flex;gap:3px;vertical-align:middle}
.mmchips i{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font:700 .6rem var(--f-mono);color:#fff;font-style:normal}
.g-mm{display:grid;grid-template-columns:repeat(2,18px);gap:5px}
.g-mm i{width:18px;height:18px;border-radius:50%}

/* Farm: no rating, a little world that keeps growing while you're away */
.g-farm{font-size:2.1rem;line-height:1}
.fbar{display:flex;align-items:center;gap:12px;font-weight:800}
.fcoins{font:700 1.25rem var(--f-mono);font-variant-numeric:tabular-nums}
.flv{font-size:.85rem;color:var(--muted);white-space:nowrap}
.fxp{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.fxp i{display:block;height:100%;background:var(--farm);border-radius:99px}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--tip);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);vertical-align:-.06em;margin-left:3px}
.ftabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.ftab{padding:9px 2px;border-radius:10px;font-weight:800;font-size:.85rem;position:relative}
.ftab.on{background:var(--farm);color:var(--surface)}
.ftab b{position:absolute;top:-6px;right:-2px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--num);color:#fff;font:700 .68rem/18px var(--f-mono)}
.fpanel{display:flex;flex-direction:column;gap:10px}
.seeds{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.seed{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;padding:6px 6px 5px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font:700 .74rem var(--f-mono)}
.seed span{font-size:1.45rem;line-height:1.2}
.seed.on{border-color:var(--farm);box-shadow:inset 0 0 0 2px var(--farm)}
.seed b{font-weight:700;white-space:nowrap}
.seed[disabled]{opacity:.45}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plot{aspect-ratio:1;border-radius:12px;background:var(--soil);display:grid;place-items:center;position:relative;font-size:2rem;padding:0;overflow:hidden;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.plot .crop{display:inline-block;line-height:1;transition:transform .9s linear}
.plot.grow{background:var(--soilWet)}
.plot.dry::after{content:"💧";position:absolute;top:4px;right:5px;font-size:.85rem}
.plot.ready{background:var(--soilWet);box-shadow:inset 0 0 0 3px var(--tip)}
.plot.ready .crop{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.plot.buy{background:transparent;border:2px dashed var(--line);box-shadow:none;font:800 .78rem/1.3 var(--f-body);color:var(--muted)}
.pb{position:absolute;left:8px;right:8px;bottom:7px;height:5px;border-radius:3px;background:rgba(0,0,0,.2);overflow:hidden}
.pb i{display:block;height:100%;background:var(--farm)}
.fh{font:400 1rem var(--f-display);margin:6px 0 0;color:var(--farm)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.fcard.lock{opacity:.6}
.fcard .em{font-size:1.8rem;line-height:1}
.fcard small{color:var(--muted);display:block;font-size:.8rem}
.fcol{display:flex;flex-direction:column;gap:6px}
.fbtn{padding:9px 12px;border-radius:10px;font-weight:800;font-size:.85rem;background:var(--farm);color:var(--surface);white-space:nowrap}
.fbtn.ghost{background:var(--soft);color:var(--ink)}
.fbtn[disabled]{opacity:.4}
.need{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 3px}
.need span{font:700 .8rem var(--f-mono);padding:2px 6px;border-radius:6px;background:var(--soft)}
.need span.miss{color:var(--bad)}
.pen{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.ani{width:56px;height:56px;border-radius:12px;background:var(--soft);font-size:1.7rem;display:grid;place-items:center;position:relative;padding:0}
.ani.ready{box-shadow:inset 0 0 0 3px var(--tip)}
.ani .prod{position:absolute;top:-4px;right:-4px;font-size:1.1rem}
.ani .pb{left:7px;right:7px;bottom:5px;height:4px}

/* Tip card */
.tipcard{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tipin{pointer-events:auto;width:100%;max-width:460px;box-sizing:border-box;background:var(--surface);border:2px solid var(--tip);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px color-mix(in srgb,var(--ink) 30%,transparent);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px)}}
.tiphead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tipstep{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.tipin h4{margin:0;font-size:1.05rem;font-weight:800}
.tipin p{margin:0;font-size:.92rem;line-height:1.45}
.tipin .x{font-size:1.3rem;line-height:1;padding:4px 8px;color:var(--muted)}
.tipin .btns .btn{padding:11px}
.tipword{font-family:var(--f-display);letter-spacing:.06em;color:var(--wrd)}

/* Sheet + toast */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:460px;border-radius:22px 22px 0 0;box-sizing:border-box;
  padding:24px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .28s ease-out;max-height:90%;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;color:var(--acc)}
.sheet p{margin:0;color:var(--muted)}
.sheet p b{color:var(--ink)}
.delta{display:flex;align-items:baseline;gap:12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.delta strong{font-size:2.4rem}
.delta .up{color:var(--ok)} .delta .down{color:var(--bad)}
.delta span{color:var(--muted)}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:800;background:var(--soft)}
.btn.pri{background:var(--acc);color:var(--surface)}
.btn[disabled]{opacity:.5}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input{font:600 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;-webkit-user-select:text;user-select:text}
.err{color:var(--bad)!important;font-weight:600;min-height:1.2em}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:30;pointer-events:none;max-width:85vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
html{background:var(--bg)}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tipcard" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const rnd=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TIP_COST=0.08; // score lost per revealed tip move
const MM_COLORS=["#E5484D","#F2851A","#F5C518","#30A46C","#12A5C9","#3E63DD","#8E4EC6","#E93D82"];
const MM_NAMES=["red","orange","yellow","green","cyan","blue","purple","pink"];

/* ---------- Ratings ---------- */
const GAMES={
  sudoku:{name:"Sudoku",c:"var(--sdk)",desc:"Harder techniques as you climb"},
  numbers:{name:"Number Match",c:"var(--num)",desc:"Tighter boards, fewer adds"},
  wordle:{name:"Wordle",c:"var(--wrd)",desc:"Rarer words, then hard mode"},
  mastermind:{name:"Mastermind",c:"var(--mm)",desc:"More pegs and colors as you climb"}
};
const RANKS=[[0,"Bronze"],[900,"Silver"],[1200,"Gold"],[1500,"Platinum"],[1800,"Diamond"],[2100,"Master"]];
const rankOf=r=>{let n="Bronze";for(const[t,name] of RANKS) if(r>=t) n=name;return n};
const KEY="eloArcade.v1",AKEY="eloArcade.account";
const fresh=()=>({r:1000,games:0,wins:0,peak:1000,hist:[1000]});
function normalize(d){d=d&&typeof d==="object"?d:{};const o={};for(const g in GAMES)o[g]=Object.assign(fresh(),d[g]||{});return o}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let store=normalize(lsGet(KEY));
function save(){lsSet(KEY,store);Acct.push()}
function targetRating(g){return clamp(store[g].r+rnd(201)-100,400,2600)}
function applyElo(g,puzzleR,S,mult=1,win=S>=.5,bonus=0){
  const st=store[g],K=(st.games<10?48:28)*mult;
  const E=1/(1+Math.pow(10,(puzzleR-st.r)/400));
  const d=Math.round(K*(S-E))+bonus;
  const before=st.r;st.r=Math.max(100,st.r+d);st.games++;if(win)st.wins++;
  st.peak=Math.max(st.peak,st.r);st.hist.push(st.r);if(st.hist.length>30)st.hist.shift();
  save();return{before,after:st.r,d:st.r-before,E};
}

/* ---------- Accounts (username + password, synced through a small Supabase database) ---------- */
const Acct=(()=>{
  const CFG=window.ARCADE_CONFIG;const available=!!CFG;
  const configured=!!(CFG&&CFG.supabaseUrl&&CFG.supabaseKey);
  let a=lsGet(AKEY);let busy=false,timer=null;
  function headers(){const h={"Content-Type":"application/json",apikey:CFG.supabaseKey};if(/^eyJ/.test(CFG.supabaseKey))h.Authorization="Bearer "+CFG.supabaseKey;return h}
  async function rpc(fn,args){
    let r;try{r=await fetch(CFG.supabaseUrl.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:headers(),body:JSON.stringify(args)})}
    catch(e){throw new Error("Can't reach the server. Check your connection.")}
    const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
    if(!r.ok){const m=(j&&(j.message||j.msg))||("Server error "+r.status);const err=new Error(m);err.auth=/session expired/i.test(m);throw err}
    return j;
  }
  function merge(server){ // per game, keep whichever copy has more games played
    const s=normalize(server);let changed=false;
    for(const g in GAMES){if(store[g].games>s[g].games){s[g]=store[g];changed=true}}
    store=s;lsSet(KEY,store);return changed;
  }
  function set(v){a=v;lsSet(AKEY,a);refreshChip()}
  async function doPush(){
    if(!a||!configured)return;if(busy){a.pending=true;return}
    busy=true;
    try{await rpc("arcade_save",{p_token:a.token,p_progress:store});set(Object.assign(a,{pending:false,synced:Date.now()}))}
    catch(e){if(e.auth){set(null);toast("Signed out. Log in again to sync.")}else set(Object.assign(a,{pending:true}))}
    finally{busy=false}
  }
  function push(){if(!a)return;a.pending=true;lsSet(AKEY,a);clearTimeout(timer);timer=setTimeout(doPush,400)}
  async function start(){
    if(!a||!configured)return;
    try{const j=await rpc("arcade_load",{p_token:a.token});const ch=merge(j.progress);set(Object.assign(a,{synced:Date.now(),pending:ch}));if(ch)doPush();if(!cur)showHome()}
    catch(e){if(e.auth){set(null);toast("Signed out. Log in again to sync.")}}
  }
  async function enter(kind,user,pass){
    const j=await rpc(kind==="new"?"arcade_register":"arcade_login",{p_username:user,p_password:pass});
    set({token:j.token,username:j.username,pending:false});
    const ch=merge(j.progress);if(ch)await doPush();else set(Object.assign(a,{synced:Date.now()}));
  }
  async function logout(){const t=a&&a.token;set(null);store=normalize(null);lsSet(KEY,store);for(const k in sessions)delete sessions[k];
    if(t)try{await rpc("arcade_logout",{p_token:t})}catch(e){}}
  function refreshChip(){const b=$("#acctB");if(!b)return;b.innerHTML=chipHTML()}
  function chipHTML(){if(!a)return`<i></i>Sign in`;return`<i class="${a.pending?"wait":"on"}"></i>${esc(a.username)}`}
  addEventListener("online",()=>{if(a&&a.pending)doPush()});
  return{available,configured,get user(){return a},push,start,enter,logout,chipHTML};
})();

function openAccount(){
  const sc=document.createElement("div");sc.className="scrim";
  const close=()=>sc.remove();
  sc.onclick=e=>{if(e.target===sc)close()};
  const u=Acct.user;
  if(u){
    const when=u.synced?new Date(u.synced).toLocaleString([], {dateStyle:"medium",timeStyle:"short"}):"not yet";
    sc.innerHTML=`<div class="sheet" role="dialog" aria-label="Account"><h3>${esc(u.username)}</h3>
      <p>Your ratings are saved to this account after every game, so you can log in on any phone and carry on.</p>
      <p>${u.pending?"<b>Waiting to sync.</b> Your latest games will upload when you're back online.":`Last synced <b>${esc(when)}</b>.`}</p>
      <div class="btns"><button class="btn" id="lo">Log out</button><button class="btn pri" id="cl">Done</button></div></div>`;
    $("#cl",sc).onclick=close;
    $("#lo",sc).onclick=async()=>{await Acct.logout();close();showHome();toast("Logged out")};
  }else if(!Acct.configured){
    sc.innerHTML=`<div class="sheet" role="dialog" aria-label="Account"><h3>Accounts</h3>
      <p>Accounts need a free database before anyone can register. Follow <b>SETUP.md</b> in the app folder: create a Supabase project, run one SQL script, then paste two values into <b>config.js</b>.</p>
      <p>Until then your ratings are saved on this phone.</p>
      <div class="btns"><button class="btn pri" id="cl">OK</button></div></div>`;
    $("#cl",sc).onclick=close;
  }else{
    sc.innerHTML=`<form class="sheet" role="dialog" aria-label="Sign in" id="af" novalidate><h3>Sign in</h3>
      <p>Log in to save your ratings and play on any phone. Ratings already earned here are added to the account.</p>
      <div class="field"><label for="au">Username</label><input id="au" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" placeholder="3–20 letters, numbers or _"></div>
      <div class="field"><label for="ap">Password</label><input id="ap" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
      <p class="err" id="ae" role="alert"></p>
      <div class="btns"><button type="button" class="btn" id="reg">Create account</button><button type="submit" class="btn pri" id="lg">Log in</button></div></form>`;
    const f=$("#af",sc),err=$("#ae",sc);
    const go=async kind=>{
      const user=$("#au",sc).value.trim().toLowerCase(),pass=$("#ap",sc).value;
      if(!/^[a-z0-9_]{3,20}$/.test(user)){err.textContent="Username must be 3–20 letters, numbers or _.";return}
      if(pass.length<6){err.textContent="Password must be at least 6 characters.";return}
      err.textContent="";sc.querySelectorAll(".btn").forEach(b=>b.disabled=true);
      try{await Acct.enter(kind,user,pass);close();showHome();toast(kind==="new"?"Account created":"Logged in")}
      catch(e){err.textContent=e.message}
      finally{sc.querySelectorAll(".btn").forEach(b=>b.disabled=false)}
    };
    f.onsubmit=e=>{e.preventDefault();go("login")};
    $("#reg",sc).onclick=()=>{$("#ap",sc).setAttribute("autocomplete","new-password");go("new")};
    setTimeout(()=>$("#au",sc).focus(),50);
  }
  document.body.appendChild(sc);
}

/* ---------- Shell ---------- */
const sessions={};let cur=null;
function toast(msg,ms=1600){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)}
function spark(h,c){if(h.length<2)return"";const w=84,ht=22,mn=Math.min(...h),mx=Math.max(...h),sp=Math.max(mx-mn,40);
  const pts=h.map((v,i)=>[i/(h.length-1)*w,ht-2-(v-mn)/sp*(ht-4)]);
  return `<svg class="spark" width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.6" fill="${c}"/></svg>`}
const glyphs={
  sudoku:`<div class="g-sdk">${[5,"",3,"",7,"",8,"",1].map(v=>`<i>${v}</i>`).join("")}</div>`,
  numbers:`<div class="g-num"><b>3</b><b>7</b></div>`,
  mastermind:`<div class="g-mm">${[0,5,3,7].map(c=>`<i style="background:${MM_COLORS[c]}"></i>`).join("")}</div>`,
  wordle:`<div class="g-wrd">${["var(--ok)","var(--absent)","var(--warn)","var(--absent)","var(--ok)","var(--ok)","var(--warn)","var(--ok)","var(--absent)"].map(c=>`<i style="background:${c}"></i>`).join("")}</div>`
};
function showHome(){
  sdkPause();fStop();cur=null;hideTip();document.documentElement.style.removeProperty("--acc");
  app.innerHTML=`<header class="brand"><div class="brandrow"><h1><span>Puzzle</span> <span>Ar</span><span>cade</span></h1>
  ${Acct.available?`<button class="acctB" id="acctB" aria-label="Account">${Acct.chipHTML()}</button>`:""}</div>
  <p>Four puzzles, four separate ratings. Every new puzzle is picked close to your current rating.</p></header>
  <section class="cabs">${Object.entries(GAMES).map(([g,G])=>{const s=store[g];const live=sessions[g]&&!sessions[g].done;
    return `<button class="cab" data-g="${g}" style="--c:${G.c}" aria-label="Play ${G.name}, rating ${s.r}">
      <div class="glyph">${glyphs[g]}</div>
      <div><h2>${G.name}</h2><div class="meta">${s.games?`${s.games} played · ${Math.round(s.wins/s.games*100)}% solved`:G.desc}</div>${spark(s.hist,G.c)}</div>
      <div class="rt"><span class="rnum">${s.r}</span><span class="chip${live?" live":""}">${live?"Resume":rankOf(s.r)}</span></div></button>`}).join("")}
    <button class="cab" id="farmB" style="--c:var(--farm)" aria-label="Open the farm, level ${F.lv}">
      <div class="glyph g-farm">🌻</div><div><h2>Farm</h2><div class="meta">${fMeta()}</div></div>
      <div class="rt"><span class="rnum">${F.lv}</span><span class="chip">Level</span></div></button></section>
  <section class="howto">
    <div><b>How ratings work.</b> Everyone starts at 1000. Solving a puzzle rated above you earns more; failing one rated below you costs more. Your first 10 games in each puzzle move faster.</div>
    <div><b>What the rating changes.</b> Sudoku asks for harder techniques: pointing pairs, then pairs, X-Wings and beyond. Solving is what counts, and a quick clean solve earns a bonus so you reach your level fast. Number Match deals tighter boards and fewer adds. Wordle draws rarer words and switches on hard mode from 1700. Mastermind adds repeats, then more pegs and colors; cracking the code in fewer guesses scores higher.</div>
    <div><b>Tips.</b> Tap Tip in any game. The strategy is free. Revealing the exact move takes ${Math.round(TIP_COST*100)}% off that game's score.</div>
    <div class="ladder">${RANKS.map(([t,n])=>`<span>${n} ${t||"<900"}${t?"+":""}</span>`).join("")}</div>
  </section>`;
  app.querySelectorAll(".cab[data-g]").forEach(b=>b.onclick=()=>openGame(b.dataset.g));
  $("#farmB").onclick=openFarm;
  const ab=$("#acctB");if(ab)ab.onclick=openAccount;
}
function openGame(g,fresh){
  sdkPause();hideTip();
  document.documentElement.style.setProperty("--acc",GAMES[g].c);
  if(fresh||!sessions[g]||sessions[g].done) sessions[g]=null;
  cur=g;
  app.innerHTML=`<div class="top"><button class="back" id="back">‹ Arcade</button><h2>${GAMES[g].name}</h2><button class="help" id="help" aria-label="How to play">?</button></div>
  <div class="vs"><div><small>You</small><strong id="youR">${store[g].r}</strong></div>
  <div class="mid"><small id="rankL">${rankOf(store[g].r)}</small></div>
  <div class="right"><small>Puzzle</small><strong id="puzR">…</strong></div></div>
  <div class="stage" id="stage"><div class="loading">Building a puzzle at your level…</div></div>`;
  $("#back").onclick=showHome;$("#help").onclick=()=>openRules(g);
  setTimeout(()=>{if(cur!==g)return;if(!sessions[g]) sessions[g]=MAKERS[g]();$("#puzR").textContent=sessions[g].puzzleR;RENDER[g]();if(g==="sudoku")sdkStart()},30);
}
function giveUpButton(onGive){
  const b=document.createElement("button");b.className="giveup";b.textContent="Give up";
  b.onclick=()=>{if(b.classList.contains("arm")){onGive();return}b.classList.add("arm");b.textContent="Tap again to give up";
    setTimeout(()=>{b.classList.remove("arm");b.textContent="Give up"},3000)};
  return b;
}
const tipNote=s=>s.tipsUsed?` ${s.tipsUsed} tip move${s.tipsUsed>1?"s":""} revealed.`:"";
function finish(g,win,S,detail,mult=1,bonus=0){
  const s=sessions[g];if(s.done)return;s.done=true;hideTip();if(g==="sudoku")sdkPause();
  const res=applyElo(g,s.puzzleR,S,mult,win,bonus);
  const sc=document.createElement("div");sc.className="scrim";
  const sign=res.d>0?"+":res.d<0?"−":"±";
  const newRank=rankOf(res.after)!==rankOf(res.before)?`<p><b>New rank: ${rankOf(res.after)}</b></p>`:"";
  sc.innerHTML=`<div class="sheet" role="dialog" aria-label="Result"><h3>${win?"Solved":"Not this time"}</h3><p>${detail}${tipNote(s)}</p>
    <div class="delta"><strong class="${res.d>=0?"up":"down"}">${sign}${Math.abs(res.d)}</strong><span>${res.before} → ${res.after}</span></div>${newRank}
    <p style="font-size:.82rem">Puzzle ${s.puzzleR} vs you ${res.before}: expected score ${Math.round(res.E*100)}%, you scored ${Math.round(S*100)}%.${mult>1?` Speed bonus ×${mult.toFixed(1)}.`:""}${bonus?` Quick-solve bonus +${bonus}.`:""}</p>
    <div class="btns"><button class="btn" id="toHome">Arcade</button><button class="btn pri" id="next">Next puzzle</button></div></div>`;
  setTimeout(()=>{document.body.appendChild(sc);$("#next",sc).focus()},win?500:350);
  $("#toHome",sc).onclick=()=>{sc.remove();showHome()};
  $("#next",sc).onclick=()=>{sc.remove();openGame(g,true)};
  const y=$("#youR");if(y){y.textContent=res.after;$("#rankL").textContent=rankOf(res.after)}
}

/* ---------- Rules (the ? button) ---------- */
const OK='<span class="rk ok" aria-label="allowed">✓</span>',NO='<span class="rk no" aria-label="not allowed">✕</span>';
const T=(v,cls="")=>`<b class="dt ${cls}">${v}</b>`;
const rule=(vis,txt)=>`<div class="rl"><div class="rv">${vis}</div><div class="rt">${txt}</div></div>`;
function rulesHTML(g){
  const s=sessions[g];
  if(g==="sudoku"){
    let grid="";for(let r=0;r<9;r++)for(let c=0;c<9;c++){const inBox=r>=3&&r<6&&c>=3&&c<6;grid+=`<i class="${r===1?"hr":c===7?"hc":inBox?"hb":""}"></i>`}
    return rule(`<div class="mini9">${grid}</div>`,"<b>1–9 once</b> in every row, column and 3×3 box")
     +rule(`<div class="dstrip">${T(5,"sdkc sel")}<span class="ar">→</span>${[1,2,3].map(n=>T(n,"key")).join("")}</div>`,"Tap a cell, then a number")
     +rule(`<div class="dnotes">${[1,"",3,"","","",7,"",9].map(n=>`<span>${n}</span>`).join("")}</div>`,"<b>✎ Notes</b> pencil in options")
     +rule(`<div class="dstrip">${T(4,"bad")}${T(4,"bad")}${T(4,"bad")}</div>`,"3 mistakes ends the game")
     +rule(`<div class="dclock">5:00</div>`,"No time pressure. A <b>quick</b> clean solve earns a bonus");
  }
  if(g==="numbers"){
    let nb="";for(let i=0;i<9;i++)nb+=T(i===4?"6":"",i===4?"sel":"ring");
    return rule(`<div class="dstrip">${T(3)}${T(3)}</div>${OK}`,"Same number")
     +rule(`<div class="dstrip">${T(3)}${T(7)}</div>${OK}`,"Adds up to 10")
     +rule(`<div class="dstrip">${T(3)}${T(5)}</div>${NO}`,"Anything else")
     +rule(`<div class="d3x3">${nb}</div>`,"Neighbors in <b>any direction</b>, diagonals too")
     +rule(`<div class="dstrip">${T(4)}${T("","gone")}${T("","gone")}${T(4)}</div>${OK}`,"Cleared cells don't block")
     +rule(`<div class="dwrap"><div class="dstrip"><span class="dots">…</span>${T(2)}</div><div class="dstrip">${T(8)}<span class="dots">…</span></div></div>${OK}`,"A row's end links to the next row's start")

/* ---------- Number Match (10 per row, 42 to start) ---------- */
const W=10,START=42;
function nmCan(cells,a,b){
  if(a===b)return false;if(a>b)[a,b]=[b,a];
  const va=cells[a].v,vb=cells[b].v;if(!(va===vb||va+vb===10))return false;
  const clear=step=>{for(let k=a+step;k<b;k+=step)if(!cells[k].x)return false;return true};
  if(clear(1))return true;const diff=b-a,ca=a%W,cb=b%W;
  if(diff%W===0&&clear(W))return true;
  if(diff%(W+1)===0&&cb-ca===diff/(W+1)&&clear(W+1))return true;
  if(diff%(W-1)===0&&ca-cb===diff/(W-1)&&clear(W-1))return true;
  return false;
}
function nmPairs(cells){ // every open pair, found by walking forward in four directions
  const out=[],n=cells.length;
  for(let a=0;a<n;a++){if(cells[a].x)continue;const ca=a%W,seen=new Set();
    for(const step of [1,W,W+1,W-1]){
      for(let k=1;;k++){const i=a+k*step;if(i>=n)break;
        if(step===W+1&&i%W!==ca+k)break;if(step===W-1&&i%W!==ca-k)break;
        if(!cells[i].x){const v=cells[a].v,w=cells[i].v;if((v===w||v+w===10)&&!seen.has(i)){seen.add(i);out.push([a,i])}break}}}}
  return out;
}
function nmCleanCells(cells){const rows=[];for(let i=0;i<cells.length;i+=W)rows.push(cells.slice(i,i+W));
  const kept=rows.filter(r=>r.some(c=>!c.x));let out=kept.flat();while(out.length&&out.at(-1).x)out.pop();return{cells:out,cleared:rows.length-kept.length}}
function makeNumbers(){
  const R=targetRating("numbers"),t=clamp((R-600)/1500,0,1);
  const adds=Math.round(5-t*3),want=Math.round(6-t*4); // pairs in view at the start: 6 for beginners, down to 2
  // Random board, then re-roll numbers that sit in a pair until only a few pairs show. No digit may take over the board.
  let b=null;
  for(let k=0;k<20&&!(b&&b.open===want);k++){const cells=Array.from({length:START},()=>({v:1+rnd(9),x:false})),cnt=Array(10).fill(0);
    cells.forEach(c=>cnt[c.v]++);let open=nmPairs(cells).length;
    for(let it=0;it<600&&open>want;it++){const ps=nmPairs(cells),i=ps[rnd(ps.length)][rnd(2)],old=cells[i].v,v=1+rnd(9);
      if(v===old||cnt[v]>=7)continue;cells[i].v=v;const n=nmPairs(cells).length;
      if(n<=open&&n>=1){open=n;cnt[old]--;cnt[v]++}else cells[i].v=old}
    if(!b||Math.abs(open-want)<Math.abs(b.open-want))b={cells,open}}
  return{cells:b.cells,adds,sel:-1,puzzleR:R,open:b.open,done:false,tipsUsed:0,hint:null};
}
function numbersTip(s){
  const pairs=nmPairs(s.cells);
  if(!pairs.length){
    if(s.adds>0)return{title:"Add numbers",strategy:"There are no pairs left on the board. Adding copies every remaining number to the end, which creates new neighbors. Clear as much as you can before each add, because each add copies whatever is left.",
      move:`Tap Add numbers. You have ${s.adds} left.`,free:true,action:{label:"Add numbers",fn:nmAdd}};
    return{title:"No moves left",strategy:"No pairs remain and there are no adds left, so this board can't be finished.",move:null};
  }
  const partners={};pairs.forEach(([a,b])=>{partners[a]=(partners[a]||0)+1;partners[b]=(partners[b]||0)+1});
  const scored=pairs.map(p=>{const cells=s.cells.map(c=>({...c}));cells[p[0]].x=cells[p[1]].x=true;const cl=nmCleanCells(cells);
    const after=nmPairs(cl.cells).length;return{p,cleared:cl.cleared,after,gain:after-(pairs.length-1),forced:Math.min(partners[p[0]],partners[p[1]])===1&&(partners[p[0]]>1||partners[p[1]]>1)}});
  const name=p=>`the ${s.cells[p[0]].v} and the ${s.cells[p[1]].v}`;
  const where=i=>`row ${((i/W)|0)+1}`;
  const why=(a,b)=>{const va=s.cells[a].v,vb=s.cells[b].v;return va===vb?"they match":"they add up to 10"};
  let pick=scored.find(x=>x.cleared>0);
  if(pick)return pkg(pick,"Clear a row",`Look for a pair that empties a whole row. Cleared rows disappear and pull the rows below up, which gives numbers new neighbors.`,
    `Match ${name(pick.p)} in ${where(pick.p[0])}${where(pick.p[0])!==where(pick.p[1])?` and ${where(pick.p[1])}`:""}. ${pick.cleared>1?`${pick.cleared} rows`:"A row"} clears.`);
  pick=scored.filter(x=>x.gain>0).sort((a,b)=>b.gain-a.gain)[0];
  if(pick)return pkg(pick,"Open up the board",`Prefer pairs that unblock other numbers. Clearing a cell that sits between two numbers lets them see each other and creates new pairs.`,
    `Match ${name(pick.p)} (${why(...pick.p)}). That opens ${pick.gain} new pair${pick.gain>1?"s":""}.`);
  pick=scored.find(x=>x.forced);
  if(pick)return pkg(pick,"Use numbers with one partner",`Some numbers have only one possible partner. Match those first, before that partner gets used somewhere else.`,
    `Match ${name(pick.p)} (${why(...pick.p)}). One of them has no other partner.`);
  pick=scored.sort((a,b)=>b.p[1]-a.p[1])[0];
  return pkg(pick,"Work from the bottom",`When no move stands out, take pairs near the end of the board. That keeps the top rows intact, and the next add will line new numbers up beneath them.`,
    `Match ${name(pick.p)} (${why(...pick.p)}).`);

}

   <p class="rule">Tap two equal numbers or two that add up to 10. They must touch sideways, up-down or diagonally, with only cleared cells between. A row's end links to the next row's start.</p>

function drawNumbers(){

function nmMatch(a,b){const s=sessions.numbers;s.cells[a].x=true;s.cells[b].x=true;s.sel=-1;s.hint=null;

function score(g,ans){const res=Array(5).fill("a"),pool={};

    drawWordle(s.guesses.length-1);const n=s.guesses.length;
    if(w===s.answer){const S=Math.max(.3,[1,1,1,1,.9,.75,.6][n]-TIP_COST*s.tipsUsed);setTimeout(()=>finish("wordle",true,S,`Got <b>${s.answer.toUpperCase()}</b> in ${n} guess${n>1?"es":""}.`),600)}
    else if(n>=6)setTimeout(()=>finish("wordle",false,0,`The word was <b>${s.answer.toUpperCase()}</b>.`),600);
    return}
  if(/^[a-z]$/.test(k)&&s.cur.length<5){s.cur+=k;drawWordle()}
}

/* ---------- Mastermind ---------- */
const MM_LEVELS=[ // [from rating, pegs, colors, repeats allowed, guesses, par guesses]
  [0,4,6,false,10,5],[950,4,6,true,10,5.5],[1300,5,7,true,10,6.5],[1700,5,8,true,10,7],[2100,5,8,true,8,7]];
function mmLevel(R){let L=MM_LEVELS[0];for(const l of MM_LEVELS)if(R>=l[0])L=l;return L}
function mmFeedback(g,s){let ex=0;const cg=new Array(8).fill(0),cs=new Array(8).fill(0);
  for(let i=0;i<g.length;i++){if(g[i]===s[i])ex++;else{cg[g[i]]++;cs[s[i]]++}}
  let cl=0;for(let c=0;c<8;c++)cl+=Math.min(cg[c],cs[c]);return ex*10+cl}
function mmAll(s){const out=[];const n=Math.pow(s.C,s.L);
  for(let k=0;k<n;k++){const code=[];let x=k;for(let i=0;i<s.L;i++){code.push(x%s.C);x=(x/s.C)|0}
    if(!s.dup&&new Set(code).size<s.L)continue;out.push(code)}return out}
function makeMastermind(){
  const R=targetRating("mastermind"),[,L,C,dup,max,par]=mmLevel(R);
  let secret=[];if(dup)for(let i=0;i<L;i++)secret.push(rnd(C));else secret=shuffle([...Array(C).keys()]).slice(0,L);
  return{L,C,dup,max,par,secret,rows:[],cur:new Array(L).fill(-1),slot:0,puzzleR:R,done:false,tipsUsed:0};
}
function mmCands(s){return mmAll(s).filter(c=>s.rows.every(r=>mmFeedback(r.code,c)===r.fb))}
const mmName=code=>code.map(c=>MM_NAMES[c]).join(", ");
const mmChips=code=>`<span class="mmchips">${code.map(c=>`<i style="background:${MM_COLORS[c]}">${c+1}</i>`).join("")}</span>`;
function mmTip(s){
  const left=s.max-s.rows.length,fill=code=>({label:"Fill it in",fn:()=>{s.cur=code.slice();s.slot=s.L;drawMM()}});
  if(!s.rows.length){
    const code=s.dup?[...Array(s.L)].map((_,i)=>Math.min((i/2)|0,s.C-1)):[...Array(s.L).keys()];
    return{title:s.dup?"Open with pairs":"Open with different colors",
      strategy:s.dup?"Start with pairs of colors, like two reds and two oranges. Doubles tell you both which colors are in the code and how many times, and the answers split the possible codes evenly.":"Repeats aren't allowed in this code, so open with as many different colors as possible to learn which colors are in it.",
      move:`Try ${mmChips(code)} (${mmName(code)}).`,action:fill(code)};
  }
  const cands=mmCands(s);
  if(cands.length===1)return{title:"Only one code fits",strategy:"Check every row's pins against each other. Just one code satisfies all of them, so play it.",move:`It's ${mmChips(cands[0])} (${mmName(cands[0])}).`,action:fill(cands[0])};
  if(cands.length===2||left===1)return{title:cands.length===2?"Two codes left":"Last guess",
    strategy:cands.length===2?"Only two codes fit your clues. Play one of them. If it's wrong, the other one is the answer.":`This is your last guess, so play a code that could be the answer. ${cands.length} codes still fit.`,
    move:`Play ${mmChips(cands[0])} (${mmName(cands[0])}).`,action:fill(cands[0])};
  // Pick the guess that splits the remaining codes into the most groups (sampled when the field is large)
  const all=mmAll(s),sample=(a,n)=>a.length<=n?a:shuffle(a.slice()).slice(0,n);
  const evalSet=sample(cands,1500),pool=[...sample(cands,250),...sample(all,150)];
  const cset=new Set(cands.map(c=>c.join()));let best=null;
  for(const g of pool){const m=new Map();for(const c of evalSet){const k=mmFeedback(g,c);m.set(k,(m.get(k)||0)+1)}
    let H=0,big=0;m.forEach(v=>{const p=v/evalSet.length;H-=p*Math.log2(p);big=Math.max(big,v)});
    const isC=cset.has(g.join()),val=H+(isC?0.1:0);if(!best||val>best.val)best={g,val,groups:m.size,big,isC}}
  const scale=cands.length/evalSet.length;
  return{title:"Split the possibilities",strategy:`${cands.length} codes still fit every row. Rather than guessing one at random, play a code that tests the open questions: which colors are in it and where they sit. A good guess leaves few codes whatever pins come back.`,
    move:`Play ${mmChips(best.g)} (${mmName(best.g)}). The pins it can give split the ${cands.length} codes into ${best.groups} groups, the largest about ${Math.max(1,Math.round(best.big*scale))}.${best.isC?" It could also be the code.":""}`,action:fill(best.g)};
}
function renderMastermind(){
  const s=sessions.mastermind,st=$("#stage");
  st.innerHTML=`<div class="info"><span><b>${s.L}</b> pegs · <b>${s.C}</b> colors</span><span>${s.dup?"Repeats allowed":"No repeats"}</span><span><b id="mmLeft">${s.max-s.rows.length}</b> tries</span></div>
   <div class="mmboard" id="mmb" style="--L:${s.L}"></div>
   <p class="rule"><span class="pin ex"></span> right color, right spot &nbsp; <span class="pin cl"></span> right color, wrong spot</p>
   <div class="mmpal" id="mmpal" style="--C:${s.C}"></div>
   <div class="tools" id="tl"><button class="tool" id="mmDel">⌫ Delete</button><button class="tool on" id="mmGo">Check</button></div>`;
  $("#mmpal").innerHTML=[...Array(s.C).keys()].map(c=>`<button class="peg" style="background:${MM_COLORS[c]}" data-c="${c}" aria-label="${MM_NAMES[c]}">${c+1}</button>`).join("");
  $("#mmpal").querySelectorAll(".peg").forEach(b=>b.onclick=()=>mmPut(+b.dataset.c));
  $("#mmDel").onclick=mmDel;$("#mmGo").onclick=mmCheck;
  $("#tl").appendChild(tipButton(()=>showTip(mmTip(s))));
  st.appendChild(giveUpButton(()=>finish("mastermind",false,0,`The code was ${mmChips(s.secret)}.`)));
  drawMM();
}
function drawMM(){
  const s=sessions.mastermind,b=$("#mmb");if(!b||!s)return;let h="";
  for(let r=0;r<s.max;r++){const row=s.rows[r],active=r===s.rows.length&&!s.done;
    const code=row?row.code:active?s.cur:null;
    h+=`<div class="mmrow${active?" act":""}"><span class="mmn">${r+1}</span><div class="mmpegs">`;
    for(let i=0;i<s.L;i++){const c=code?code[i]:-1;
      h+=`<button class="peg slot${c<0?" empty":""}${active&&i===s.slot?" sel":""}" ${active?`data-i="${i}"`:'tabindex="-1"'} style="${c>=0?`background:${MM_COLORS[c]}`:""}" aria-label="${c>=0?MM_NAMES[c]:"empty"}">${c>=0?c+1:""}</button>`}
    h+=`</div><div class="pins" style="--L:${s.L}">`;
    if(row){const ex=(row.fb/10)|0,cl=row.fb%10;for(let i=0;i<s.L;i++)h+=`<span class="pin${i<ex?" ex":i<ex+cl?" cl":""}"></span>`}
    else for(let i=0;i<s.L;i++)h+=`<span class="pin"></span>`;
    h+=`</div></div>`}
  b.innerHTML=h;
  b.querySelectorAll(".act .slot").forEach(e=>e.onclick=()=>{s.slot=+e.dataset.i;if(s.cur[s.slot]>=0&&e.classList.contains("sel"))s.cur[s.slot]=-1;drawMM()});
  const l=$("#mmLeft");if(l)l.textContent=s.max-s.rows.length;
  const act=b.querySelector(".act");if(act&&s.rows.length>5)act.scrollIntoView({block:"nearest"});
}
function mmPut(c){const s=sessions.mastermind;if(!s||s.done)return;
  if(!s.dup&&s.cur.includes(c)&&s.cur[s.slot]!==c){toast("No repeats in this code");return}
  if(s.slot>=s.L){const e=s.cur.indexOf(-1);if(e<0)return;s.slot=e}
  s.cur[s.slot]=c;const nx=s.cur.indexOf(-1,s.slot+1),any=s.cur.indexOf(-1);s.slot=nx>=0?nx:any>=0?any:s.L;drawMM()}
function mmDel(){const s=sessions.mastermind;if(!s||s.done)return;
  let i=s.slot<s.L&&s.cur[s.slot]>=0?s.slot:-1;if(i<0)for(let k=s.L-1;k>=0;k--)if(s.cur[k]>=0){i=k;break}
  if(i>=0){s.cur[i]=-1;s.slot=i;drawMM()}}
function mmCheck(){const s=sessions.mastermind;if(!s||s.done)return;
  if(s.cur.includes(-1)){toast(`Fill all ${s.L} pegs first`);return}
  hideTip();const code=s.cur.slice(),fb=mmFeedback(code,s.secret);s.rows.push({code,fb});s.cur=new Array(s.L).fill(-1);s.slot=0;drawMM();
  const n=s.rows.length;
  if(fb===s.L*10){const S=clamp(0.5+0.15*(s.par-n),0.05,1)-TIP_COST*s.tipsUsed;
    setTimeout(()=>finish("mastermind",true,Math.max(.05,S),`Cracked in ${n} guess${n>1?"es":""} (par ${s.par}).`),300)}
  else if(n>=s.max)setTimeout(()=>finish("mastermind",false,0,`The code was ${mmChips(s.secret)}.`),300);
}

  tulip:crop("Tulip","🌷",15,15,48,4),corn:crop("Corn","🌽",20,25,70,5),sunflower:crop("Sunflower","🌻",30,40,105,6),pumpkin:crop("Pumpkin","🎃",45,60,160,7),

  sheep:{n:"Sheep",pl:"Sheep",e:"🐑",p:"wool",min:45,cost:800,lv:8,max:4},bee:{n:"Beehive",pl:"Beehives",e:"🐝",p:"honey",min:60,cost:1200,lv:10,max:3}};

  sign:{n:"Market sign",e:"🪧",d:"Customers come twice as often",cost:600,lv:5},spr:{n:"Sprinklers",e:"💦",d:"Fields water themselves",cost:900,lv:6},

function fPlot(p,now){ // brings a plot up to date: empty, dry (needs water), grow or ready
  if(!p)return{st:"empty",pct:0};const H=CROPS[p.c].min*MIN/2*(F.up.fert?.75:1);

   +Object.entries(FUPS).map(([k,u])=>{const lock=u.lv>F.lv||(u.req&&!F.up[u.req]);
    return`<div class="fcard${lock&&!F.up[k]?" lock":""}"><span class="em">${u.e}</span><div><b>${u.n}</b><small>${u.d}${lock?` · ${u.lv>F.lv?`level ${u.lv}`:`after ${FUPS[u.req].n}`}`:""}</small></div>
     ${F.up[k]?`<span class="chip">Owned</span>`:`<button class="fbtn" data-u="${k}" ${lock||F.coins<u.cost?"disabled":""}>${u.cost}${CO}</button>`}</div>`}).join("");
}
const fSigOf=now=>F.plots.map(p=>p?fPlot(p,now).st+p.w:"-").join()+"|"+F.animals.map(a=>fAni(a,now).ready?1:0).join("")+"|"+F.orders.length+"|"+F.plots.length;
function fDraw(){const now=Date.now(),s=fSummary(now);
  $("#fbar").innerHTML=`<span class="fcoins">${F.coins}${CO}</span><span class="flv">Level ${F.lv}</span><span class="fxp" title="${F.xp}/${fNeed(F.lv)} XP"><i style="width:${F.xp/fNeed(F.lv)*100}%"></i></span>`;
  $("#ftabs").innerHTML=[["fields","Fields",s.ready+s.dry],["animals","Animals",s.ani],["market","Market",s.deliver],["shop","Shop",0]]
    .map(([k,n,c])=>`<button class="ftab${fTab===k?" on":""}" data-t="${k}" role="tab" aria-selected="${fTab===k}">${n}${c?`<b>${c}</b>`:""}</button>`).join("");
  $("#fpanel").innerHTML={fields:fFields,animals:fAnimals,market:fMarket,shop:fShop}[fTab](now);
  fSig=fSigOf(now);
}
function fTick(){if(cur!=="farm"){fStop();return}const now=Date.now();fUpdate(now);
  if(fSigOf(now)!==fSig){fSave();fDraw();return}
  document.querySelectorAll("#fields .plot[data-i]").forEach(b=>{const p=F.plots[+b.dataset.i],st=fPlot(p,now);if(st.st!=="grow")return;
    const c=b.querySelector(".crop"),bar=b.querySelector(".pb i");if(c)c.style.transform=fScale(st.pct).slice(10);if(bar)bar.style.width=st.pct*100+"%"});
  document.querySelectorAll(".ani[data-a] .pb i").forEach(bar=>{bar.style.width=fAni(F.animals[+bar.closest(".ani").dataset.a],now).pct*100+"%"});
  const nx=$("#fNext");if(nx)nx.textContent=fLeft(F.nextOrder-now);
}
function fStop(){clearInterval(fTimer);fTimer=null}
function fAct(b,now){const d=b.dataset;
  if(d.i!=null)fTapPlot(+d.i,now);
  else if(d.s)F.seed=d.s;
  else if(d.buyplot)fBuyPlot();
  else if(d.all==="sow"){let n=0;F.plots.forEach((p,i)=>{if(!p&&fSow(i,now))n++});if(!n)toast(F.plots.some(p=>!p)?"Not enough coins":"No empty plots")}
  else if(d.all==="water"){F.plots.forEach(p=>{if(p&&fPlot(p,now).st==="dry")fWater(p,now)})}
  else if(d.all==="harvest"){let n=0;F.plots.forEach((p,i)=>{if(fPlot(p,now).st==="ready"){fHarvest(i);n++}});if(!n)toast("Nothing is ripe yet")}
  else if(d.buy){const a=ANIMALS[d.buy];if(F.coins>=a.cost){F.coins-=a.cost;F.animals.push({k:d.buy,t:now})}}
  else if(d.a!=null){const x=F.animals[+d.a],r=fAni(x,now),P=ITEMS[ANIMALS[x.k].p];
    if(r.ready){F.inv[ANIMALS[x.k].p]=(F.inv[ANIMALS[x.k].p]||0)+1;x.t=now;fXP(Math.max(1,Math.round(P.price/8)))}else toast(`${P.n}: ${fLeft(r.left)} to go`)}
  else if(d.d!=null){const o=F.orders[+d.d];if(!fHas(o))return;for(const[k,q]of Object.entries(o.items))F.inv[k]-=q;
    F.coins+=o.pay;F.orders.splice(+d.d,1);fXP(o.xp);toast(`${o.who} paid ${o.pay} coins`,1200)}
  else if(d.x!=null){F.orders.splice(+d.x,1);F.nextOrder=Math.min(F.nextOrder,now+MIN)}
  else if(d.s1||d.sa){const k=d.s1||d.sa,n=d.s1?1:F.inv[k];F.inv[k]-=n;F.coins+=ITEMS[k].price*n}
  else if(d.u){const u=FUPS[d.u];if(F.coins>=u.cost){F.coins-=u.cost;F.up[d.u]=true;toast(`${u.n}: ${u.d.toLowerCase()}`,2000)}}
}
function openFarm(){
  sdkPause();hideTip();cur="farm";document.documentElement.style.setProperty("--acc","var(--farm)");
  const now=Date.now();fUpdate(now);fSave();const s=fSummary(now);
  app.innerHTML=`<div class="top"><button class="back" id="back">‹ Arcade</button><h2>Farm</h2><span></span></div>
   <div class="fbar" id="fbar"></div><div class="ftabs" id="ftabs" role="tablist"></div><div class="fpanel" id="fpanel"></div>`;
  $("#back").onclick=showHome;
  $("#ftabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b){fTab=b.dataset.t;fDraw()}};
  $("#fpanel").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;fAct(b,Date.now());fSave();fDraw()};
  fDraw();fStop();fTimer=setInterval(fTick,1000);
  const back=[s.ready&&`${s.ready} crop${s.ready>1?"s":""} ripe`,s.ani&&`${s.ani} animal${s.ani>1?"s":""} waiting`,s.deliver&&`${s.deliver} order${s.deliver>1?"s":""} you can fill`].filter(Boolean);
  if(back.length)toast(back.join(" · "),2200);
}

const MAKERS={sudoku:makeSudoku,numbers:makeNumbers,wordle:makeWordle,mastermind:makeMastermind};
const RENDER={sudoku:renderSudoku,numbers:renderNumbers,wordle:renderWordle,mastermind:renderMastermind};

document.addEventListener("keydown",e=>{
  if(!cur||!sessions[cur]||e.metaKey||e.ctrlKey||e.altKey||document.querySelector(".scrim"))return;
  if(e.key==="Escape"&&tipState){hideTip();return}
  if(cur==="mastermind"){if(e.key==="Enter")mmCheck();else if(e.key==="Backspace")mmDel();else if(/^[1-8]$/.test(e.key)&&+e.key<=sessions.mastermind.C)mmPut(+e.key-1);else return;e.preventDefault();return}
  if(cur==="wordle"){if(e.key==="Enter")wKey("enter");else if(e.key==="Backspace")wKey("back");else if(/^[a-zA-Z]$/.test(e.key))wKey(e.key.toLowerCase());else return;e.preventDefault()}
  else if(cur==="sudoku"){const s=sessions.sudoku;
    if(/^[1-9]$/.test(e.key))sdkInput(+e.key);else if(e.key==="Backspace"||e.key==="Delete")sdkErase();
    else if(e.key==="n"){s.notesMode=!s.notesMode;drawSudoku()}
    else if(e.key.startsWith("Arrow")){const i=s.sel<0?40:s.sel,r=(i/9)|0,c=i%9;
      const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];s.sel=clamp(r+m[0],0,8)*9+clamp(c+m[1],0,8);drawSudoku();e.preventDefault()}}
});
window.__arcade={mmTip,mmCands,mmFeedback,makeMastermind,sdkScore,sdkSecs,applyElo,sudokuTip,numbersTip,wordleTip,nmPairs,nmCan,makeSudoku,makeNumbers,makeWordle,sessions,DICT,ANSWERS,fits,bestGuess,get store(){return store},get farm(){return F},fUpdate,fPlot};
showHome();
Acct.start();
})();
